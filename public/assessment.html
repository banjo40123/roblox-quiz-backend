<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><title>แบบประเมิน — GAST Quiz</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
.question-card { margin-bottom: 20px; border-left: 6px solid var(--primary); }
.question-card.phase-1 { border-left-color: #fbbf24; }
.question-card.phase-2 { border-left-color: #fb7185; }
.question-card.phase-3 { border-left-color: #a78bfa; }
.q-code { display: inline-block; background: var(--primary-light); color: white; padding: 3px 10px; border-radius: 10px; font-size: 0.8rem; font-weight: 700; margin-bottom: 8px; }
.q-text { font-size: 1.1rem; font-weight: 600; margin: 8px 0 14px; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 600px) { .choices { grid-template-columns: 1fr; } }
.choice { padding: 14px 18px; border: 2px solid #e5e7eb; border-radius: 14px; cursor: pointer; transition: all 0.2s; background: #fafafa; }
.choice:hover { border-color: var(--primary); transform: translateY(-2px); }
.choice input { display: none; }
.choice.selected { border-color: var(--primary); background: var(--primary-light); color: white; }
.choice.selected.safe { border-color: #10b981; background: #d1fae5; color: #065f46; }
.choice.selected.risky { border-color: #ef4444; background: #fee2e2; color: #991b1b; }
.phase-divider { background: linear-gradient(135deg, white, #faf5ff); padding: 16px 20px; border-radius: 16px; margin: 30px 0 20px; display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow); }
.phase-divider .icon { font-size: 2.5rem; }
.phase-divider h3 { color: var(--primary-dark); font-size: 1.3rem; }
.phase-divider p { color: var(--gray); font-size: 0.9rem; }
.result { display: none; padding: 30px; border-radius: 24px; text-align: center; margin-top: 30px; box-shadow: var(--shadow-lg); }
.result.normal { background: linear-gradient(135deg, #d1fae5, #a7f3d0); }
.result.risk { background: linear-gradient(135deg, #fef3c7, #fde68a); }
.result.addicted { background: linear-gradient(135deg, #fee2e2, #fca5a5); }
.result .big-score { font-size: 4rem; font-weight: 800; margin: 10px 0; }
.result h2 { font-size: 2rem; margin-bottom: 14px; }
.progress-bar { height: 8px; background: #e5e7eb; border-radius: 4px; overflow: hidden; margin: 20px 0; position: sticky; top: 80px; z-index: 10; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--phase-2)); width: 0%; transition: width 0.3s; }
</style>
</head>
<body>
<div class="float-shapes"><div></div><div></div><div></div><div></div></div>

<header class="header"><nav class="nav">
  <a href="index.html" class="logo"><span class="emoji">🎮</span><span>GAST Quiz</span></a>
  <ul class="nav-links">
    <li><a href="index.html">🏠 หน้าหลัก</a></li>
    <li><a href="dashboard.html">📊 Dashboard</a></li>
    <li><a href="criteria.html">📋 เกณฑ์วัดผล</a></li>
    <li><a href="assessment.html" class="active">📝 แบบประเมิน</a></li>
    <li><a href="pretest.html">🧪 Pre-test</a></li>
    <li><a href="pretest-dashboard.html">📈 ข้อมูล Pre-test</a></li>
    <li><a href="info.html">ℹ️ ข้อมูลโปรเจ็ค</a></li>
  </ul>
</nav></header>

<main class="container">
  <section class="hero fade-in">
    <h1>📝 แบบประเมิน GAST</h1>
    <p>ตอบคำถาม 15 ข้อ จาก 3 มิติ — ใช้เวลาประมาณ 5 นาที — ระบบจะคำนวณกลุ่มเสี่ยงให้ทันที</p>
  </section>

  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  <form id="quizForm">
    <div id="questionsContainer"></div>

    <div class="text-center" style="margin-top:30px;">
      <button type="button" class="btn btn-accent btn-large" onclick="calculate()">✓ ส่งแบบประเมิน</button>
    </div>
  </form>

  <div class="result" id="result"></div>
</main>

<button class="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
<footer class="footer"><p>🎮 GAST Quiz Project</p></footer>

<script>
const QUESTIONS = [
  {phase:1,code:"S01",text:"พรุ่งนี้สอบใหญ่ คุณจะเลือกทำอะไร?",safe:"อ่านหนังสือก่อนนอน",risky:"เล่นเกมต่อ ค่อยอ่านพรุ่งนี้เช้า",risk:3},
  {phase:1,code:"S02",text:"ตื่นเช้ามา สิ่งแรกที่นึกถึงคือ...",safe:"กิจกรรมวันนี้ที่โรงเรียน",risky:"Event ใหม่ในเกมที่เพิ่งออก",risk:3},
  {phase:1,code:"S03",text:"เพื่อนชวนไปเล่นกีฬาที่สนาม คุณจะ...",safe:"ไปเล่นด้วยกัน สนุกกว่า",risky:"ปฏิเสธ ขออยู่บ้านเล่นเกม",risk:3},
  {phase:1,code:"S04",text:"ระหว่างครูสอน คุณกำลังคิดถึง...",safe:"เนื้อหาที่ครูกำลังสอน",risky:"เกมที่จะเล่นตอนเย็น",risk:2},
  {phase:1,code:"S05",text:"วันหยุดสุดสัปดาห์นี้ คุณวางแผนจะ...",safe:"ทำกิจกรรมหลากหลาย เที่ยว เรียน เล่น",risky:"เล่นเกมทั้งวัน ไม่ออกจากห้อง",risk:3},
  {phase:2,code:"S06",text:"ตั้งใจว่าจะเล่น 1 ชั่วโมง พอครบเวลาแล้วคุณจะ...",safe:"ปิดเกมตามที่ตั้งใจ",risky:"เล่นต่อจนลืมเวลา",risk:3},
  {phase:2,code:"S07",text:"แม่บอกให้หยุดเล่นมากินข้าว คุณ...",safe:"หยุดเล่นทันที พูดดีๆ",risky:"หงุดหงิด ตอบไม่ดี โมโห",risk:3},
  {phase:2,code:"S08",text:"เพื่อนในเกมชวนทำเควสต์เป็นทีม คุณ...",safe:"ไปทำด้วยกัน สนุกและได้สังคม",risky:"เล่นเดี่ยวต่อ ไม่อยากคุยกับใคร",risk:2},
  {phase:2,code:"S09",text:"พยายามห้ามใจไม่ให้เล่นเกมวันนี้ ผลคือ...",safe:"ทำได้ ไปทำกิจกรรมอื่นแทน",risky:"ทำไม่ได้ ต้องกลับมาเล่นทุกครั้ง",risk:3},
  {phase:2,code:"S10",text:"คนในครอบครัวบ่นว่าเล่นเกมมากเกินไป คุณรู้สึก...",safe:"เห็นด้วย ลองลดเวลาเล่นลง",risky:"โกรธ ทะเลาะกับคนในบ้าน",risk:3},
  {phase:3,code:"S11",text:"เวลา 23:00 น. แล้ว พรุ่งนี้ต้องไปโรงเรียน คุณ...",safe:"ปิดเกมไปนอน",risky:"เล่นยันเช้า ไม่นอน",risk:3},
  {phase:3,code:"S12",text:"ผลการเรียนตกต่ำกว่าเดิม คุณคิดว่า...",safe:"อาจเพราะเล่นเกมมากไป ควรลดลง",risky:"ไม่เกี่ยวกับเกม เกมสำคัญกว่า",risk:3},
  {phase:3,code:"S13",text:"ลืมกินข้าวเพราะติดเกมหรือไม่?",safe:"ไม่เคย / นานๆ ครั้ง",risky:"บ่อย ไม่อยากหยุดเล่น",risk:3},
  {phase:3,code:"S14",text:"ปวดตา ปวดข้อมือ จากการเล่นเกมหรือไม่?",safe:"ไม่มีอาการ เพราะเล่นพอดี",risky:"มีตลอด แต่ยังเล่นต่อ",risk:3},
  {phase:3,code:"S15",text:"เลือกระหว่างเที่ยวกับเพื่อน หรืออยู่บ้านเล่นเกม คุณจะ...",safe:"ออกไปเที่ยว สนุกกว่า",risky:"อยู่บ้านเล่นเกม ดีกว่า",risk:3},
];
const PHASE_INFO = {1:{name:"หมู่บ้านยามเช้า",dim:"PREOCCUPATION",icon:"🌅",desc:"การหมกมุ่นกับเกม"},2:{name:"ตลาดกลางวัน",dim:"CONTROL",icon:"🏪",desc:"การควบคุมตนเอง"},3:{name:"เมืองยามค่ำคืน",dim:"IMPAIRMENT",icon:"🌃",desc:"ผลกระทบต่อชีวิต"}};

const container = document.getElementById('questionsContainer');
let lastPhase = 0;
QUESTIONS.forEach((q,i)=>{
  if(q.phase !== lastPhase){
    const p = PHASE_INFO[q.phase];
    container.innerHTML += `<div class="phase-divider"><div class="icon">${p.icon}</div><div><h3>ด่านที่ ${q.phase}: ${p.name}</h3><p>${p.dim} — ${p.desc}</p></div></div>`;
    lastPhase = q.phase;
  }
  container.innerHTML += `
  <div class="card question-card phase-${q.phase}">
    <span class="q-code">${q.code}</span>
    <div class="q-text">${q.text}</div>
    <div class="choices">
      <label class="choice" onclick="select(this,${i},'safe')"><input type="radio" name="q${i}" value="0">✅ ${q.safe}</label>
      <label class="choice" onclick="select(this,${i},'risky')"><input type="radio" name="q${i}" value="${q.risk}">❌ ${q.risky}</label>
    </div>
  </div>`;
});

function select(el, idx, kind){
  el.parentElement.querySelectorAll('.choice').forEach(c=>c.classList.remove('selected','safe','risky'));
  el.classList.add('selected', kind);
  el.querySelector('input').checked = true;
  updateProgress();
}
function updateProgress(){
  const total = QUESTIONS.length;
  const done = document.querySelectorAll('input[type=radio]:checked').length;
  document.getElementById('progressFill').style.width = (done/total*100) + '%';
}
function calculate(){
  let total = 0, byPhase = {1:0,2:0,3:0}, answered = 0;
  QUESTIONS.forEach((q,i)=>{
    const v = document.querySelector(`input[name="q${i}"]:checked`);
    if(v){ total += +v.value; byPhase[q.phase] += +v.value; answered++; }
  });
  if(answered < QUESTIONS.length){ alert(`ยังตอบไม่ครบ — เหลือ ${QUESTIONS.length - answered} ข้อ`); return; }

  let group, color, advice, emoji;
  if(total <= 10){ group="ปกติ"; color="normal"; emoji="🟢"; advice="เก่งมาก! ใช้เกมพอดี รู้จักแบ่งเวลา พักผ่อน เรียน และเล่นกับเพื่อนได้สมดุล 🌟"; }
  else if(total <= 25){ group="เสี่ยง"; color="risk"; emoji="🟡"; advice="เริ่มมีพฤติกรรมที่ต้องระวัง ลองตั้งเวลาเล่นและทำกิจกรรมอื่นบ้างนะ 💪"; }
  else{ group="น่าจะติดเกม"; color="addicted"; emoji="🔴"; advice="การเล่นเกมเริ่มส่งผลกับชีวิตประจำวัน ลองคุยกับคนที่ไว้ใจ หรือพบผู้เชี่ยวชาญ 🤝"; }

  const res = document.getElementById('result');
  res.className = 'result ' + color;
  res.innerHTML = `
    <h2>${emoji} ผลการประเมิน: กลุ่ม${group}</h2>
    <div class="big-score">${total} / 45</div>
    <p style="font-size:1.1rem;margin-bottom:20px;">${advice}</p>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:500px;margin:0 auto;">
      <div style="background:rgba(255,255,255,0.7);padding:12px;border-radius:12px;"><b>🌅 มิติ 1</b><br>${byPhase[1]} คะแนน</div>
      <div style="background:rgba(255,255,255,0.7);padding:12px;border-radius:12px;"><b>🏪 มิติ 2</b><br>${byPhase[2]} คะแนน</div>
      <div style="background:rgba(255,255,255,0.7);padding:12px;border-radius:12px;"><b>🌃 มิติ 3</b><br>${byPhase[3]} คะแนน</div>
    </div>
    <div style="margin-top:20px;">
      <button class="btn btn-primary" onclick="window.scrollTo({top:0,behavior:'smooth'});location.reload();">🔄 ทำใหม่</button>
      <a href="criteria.html" class="btn btn-primary">📋 ดูเกณฑ์ละเอียด</a>
    </div>`;
  res.style.display = 'block';
  res.scrollIntoView({behavior:'smooth'});
}
window.addEventListener('scroll',()=>{document.querySelector('.back-to-top').classList.toggle('show',window.scrollY>400);});
</script>
</body>
</html>
